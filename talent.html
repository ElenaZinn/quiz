<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>答题测评</title>
<style>
/* ===========================================================
   答题测评模板 · 样式
   设计目标：手机竖屏优先、结果页适合截图分享
   =========================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg1: #0b0b12;
  --bg2: #16122a;
  --bg3: #22183a;
  --card: rgba(255, 255, 255, 0.06);
  --card-strong: rgba(255, 255, 255, 0.10);
  --line: rgba(255, 255, 255, 0.14);
  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.62);
  --faint: rgba(255, 255, 255, 0.36);
  --grad: linear-gradient(135deg, #7c8cff, #22d3ee 55%, #e879f9);
  --accent: #8b9cff;
  --radius: 20px;
}

html { -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: var(--bg1);
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  line-height: 1.6;
}

/* 背景光晕 */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: 0;
  background:
    radial-gradient(circle at 18% 12%, rgba(124, 140, 255, .55), transparent 55%),
    radial-gradient(circle at 82% 24%, rgba(232, 121, 249, .38), transparent 55%),
    radial-gradient(circle at 40% 88%, rgba(34, 211, 238, .30), transparent 55%),
    linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  filter: blur(10px);
  animation: float 24s ease-in-out infinite alternate;
}

@keyframes float {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(2%, -3%) scale(1.06); }
  100% { transform: translate(-2%, 3%) scale(1.02); }
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: 22px 18px 40px;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.screen { animation: fade .32s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- 开场 ---------- */
.hero { text-align: center; padding: 26px 6px 18px; }
.hero-emoji { font-size: 2.6rem; line-height: 1; margin-bottom: 14px; }
.hero h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: .5px; }
.hero .sub { margin-top: 10px; font-size: .86rem; color: var(--muted); }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 10px 34px rgba(0, 0, 0, .35);
  padding: 20px;
}

.intro { margin-top: 8px; }

.hint {
  font-size: .82rem;
  color: var(--muted);
  margin-bottom: 16px;
  text-align: center;
}

.btn {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px 18px;
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: transform .12s ease, filter .2s ease;
}
.btn:active { transform: scale(.975); }
.btn.primary {
  background: var(--grad);
  color: #0b0b12;
  box-shadow: 0 8px 24px rgba(124, 140, 255, .35);
}
.btn.ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  margin-top: 10px;
  font-weight: 600;
}

.notice {
  margin-top: 18px;
  font-size: .68rem;
  color: var(--faint);
  text-align: center;
  line-height: 1.7;
}

/* ---------- 答题 ---------- */
.qhead {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 2px 20px;
}
.icon {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
  font-family: inherit;
}
.icon:disabled { opacity: .25; cursor: default; }

.progress {
  flex: 1;
  height: 5px;
  border-radius: 99px;
  background: rgba(255, 255, 255, .12);
  overflow: hidden;
}
.progress .bar {
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: var(--grad);
  transition: width .3s ease;
}
.counter {
  font-size: .74rem;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  min-width: 44px;
  text-align: right;
}

.qcard { animation: slide .3s ease both; }
@keyframes slide { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

.qtext {
  font-size: 1.16rem;
  font-weight: 700;
  line-height: 1.55;
  margin-bottom: 20px;
}

.options { display: flex; flex-direction: column; gap: 10px; }

.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: .95rem;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px 16px;
  cursor: pointer;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: background .16s ease, border-color .16s ease, transform .12s ease;
}
.opt:active { transform: scale(.985); }
.opt .oemoji { font-size: 1.15rem; flex-shrink: 0; }
.opt .olabel { flex: 1; line-height: 1.5; }
.opt.selected {
  background: rgba(139, 156, 255, .22);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent) inset;
}

/* ---------- 分析中 ---------- */
.analyzing {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  text-align: center;
  min-height: 60dvh;
}
.spinner {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, .14);
  border-top-color: var(--accent);
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.analyzing p { color: var(--muted); font-size: .88rem; }

/* ---------- 结果 ---------- */
.sharedbar {
  background: rgba(139, 156, 255, .16);
  border: 1px solid rgba(139, 156, 255, .34);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: .78rem;
  color: #cfd6ff;
  margin-bottom: 14px;
  text-align: center;
}

.rcard {
  background: var(--card-strong);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 26px 22px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 14px 44px rgba(0, 0, 0, .4);
}

.rtag {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.remoji { font-size: 2.1rem; line-height: 1; }
.rname {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 1px;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.rquote {
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.6;
  color: rgba(255, 255, 255, .92);
}

.rsec {
  margin-top: 18px;
  font-size: .78rem;
  color: var(--muted);
}
.rsec b {
  font-size: 1.5rem;
  font-weight: 800;
  color: #fff;
  margin-left: 6px;
  font-variant-numeric: tabular-nums;
}
.rsec-text { margin-top: 6px; font-size: .84rem; color: var(--muted); }

.divider {
  height: 1px;
  background: var(--line);
  margin: 20px 0;
}

.rline { margin-bottom: 16px; }
.rline:last-child { margin-bottom: 0; }
.rlabel {
  display: inline-block;
  font-size: .7rem;
  letter-spacing: 1px;
  color: var(--faint);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 2px 10px;
  margin-bottom: 8px;
}
.rline p { font-size: .9rem; line-height: 1.65; color: rgba(255, 255, 255, .88); }
.rline.action p { color: #fff; font-weight: 600; }

.actions { margin-top: 20px; }

/* ---------- Toast ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: 44px;
  transform: translate(-50%, 12px);
  background: rgba(20, 20, 32, .94);
  border: 1px solid var(--line);
  color: #fff;
  font-size: .82rem;
  padding: 11px 20px;
  border-radius: 99px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
  z-index: 40;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>

<script>
/* ===========================================================
   答题测评模板 · 引擎
   题库与引擎完全分离：换一个题库文件就是一款新测评。

   题库数据结构见 quizzes/talent.js
   =========================================================== */
(function () {
  'use strict';

  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);

  var state = { quiz: null, idx: 0, picks: [] };

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  function copyText(text, msg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast(msg); }
      catch (e) { toast('复制失败，请长按手动复制'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, fallback);
    } else { fallback(); }
  }

  /* ---------- 题库选择 ---------- */
  function resolveQuiz() {
    var quizzes = window.QUIZZES || {};
    var id = params.get('q') || window.DEFAULT_QUIZ;
    if (id && quizzes[id]) return quizzes[id];
    var keys = Object.keys(quizzes);
    return keys.length ? quizzes[keys[0]] : null;
  }

  /* ---------- 计分 ---------- */
  function totalsOf(quiz) {
    var totals = {};
    (quiz.mainPool || []).forEach(function (k) { totals[k] = 0; });
    state.picks.forEach(function (p, i) {
      if (p == null) return;
      var opt = quiz.questions[i].options[p];
      var s = opt.scores || {};
      Object.keys(s).forEach(function (k) { totals[k] = (totals[k] || 0) + s[k]; });
    });
    return totals;
  }

  function calcMain(quiz) {
    var totals = totalsOf(quiz);
    var pool = quiz.mainPool || [];
    var best = pool[0];
    pool.forEach(function (k) {
      if ((totals[k] || 0) > (totals[best] || 0)) best = k;
    });
    return best;
  }

  function calcSecondary(quiz) {
    var sec = quiz.secondary;
    if (!sec) return null;
    var sum = 0;
    state.picks.forEach(function (p, i) {
      if (p == null) return;
      var s = quiz.questions[i].options[p].scores || {};
      sec.sum.forEach(function (k) { sum += (s[k] || 0); });
    });
    var levels = sec.levels;
    for (var i = 0; i < levels.length; i++) {
      if (sum >= levels[i].min) {
        return { index: i, text: levels[i].text, value: levels[i].value };
      }
    }
    var last = levels.length - 1;
    return { index: last, text: levels[last].text, value: levels[last].value };
  }

  /* ---------- 开场 ---------- */
  function renderStart() {
    var q = state.quiz;
    document.title = q.title;
    app.innerHTML =
      '<div class="screen">' +
        '<div class="hero">' +
          '<div class="hero-emoji">' + esc(q.emoji || '✨') + '</div>' +
          '<h1>' + esc(q.title) + '</h1>' +
          '<p class="sub">' + esc(q.subtitle || '') + '</p>' +
        '</div>' +
        '<div class="card intro">' +
          (q.startHint ? '<div class="hint">💡 ' + esc(q.startHint) + '</div>' : '') +
          '<button class="btn primary" id="btnStart">开始测试</button>' +
        '</div>' +
        (q.notice ? '<p class="notice">' + esc(q.notice) + '</p>' : '') +
      '</div>';

    document.getElementById('btnStart').addEventListener('click', function () {
      state.idx = 0;
      renderQuiz();
    });
  }

  /* ---------- 答题 ---------- */
  function renderQuiz() {
    var q = state.quiz;
    var total = q.questions.length;
    var item = q.questions[state.idx];
    var picked = state.picks[state.idx];
    var pct = Math.round((state.idx / total) * 100);

    var optsHtml = item.options.map(function (o, i) {
      return '<button class="opt' + (picked === i ? ' selected' : '') + '" data-i="' + i + '">' +
        (o.emoji ? '<span class="oemoji">' + esc(o.emoji) + '</span>' : '') +
        '<span class="olabel">' + esc(o.label) + '</span>' +
      '</button>';
    }).join('');

    app.innerHTML =
      '<div class="screen">' +
        '<div class="qhead">' +
          '<button class="icon" id="btnBack"' + (state.idx === 0 ? ' disabled' : '') + '>‹</button>' +
          '<div class="progress"><div class="bar" style="width:' + pct + '%"></div></div>' +
          '<div class="counter">' + (state.idx + 1) + '/' + total + '</div>' +
        '</div>' +
        '<div class="qcard">' +
          '<div class="qtext">' + esc(item.text) + '</div>' +
          '<div class="options">' + optsHtml + '</div>' +
        '</div>' +
      '</div>';

    var back = document.getElementById('btnBack');
    back.addEventListener('click', function () {
      if (state.idx > 0) { state.idx--; renderQuiz(); }
    });

    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (el) {
      el.addEventListener('click', function () {
        var i = Number(el.dataset.i);
        state.picks[state.idx] = i;
        Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (x) {
          x.classList.toggle('selected', x === el);
        });
        setTimeout(function () {
          if (state.idx < total - 1) { state.idx++; renderQuiz(); }
          else { renderAnalyzing(); }
        }, 260);
      });
    });
  }

  /* ---------- 分析中 ---------- */
  function renderAnalyzing() {
    var texts = [
      '正在读取你的答案…',
      '正在比对你的习惯…',
      '正在生成你的专属结果…'
    ];
    app.innerHTML =
      '<div class="screen analyzing">' +
        '<div class="spinner"></div>' +
        '<p id="atxt">' + texts[0] + '</p>' +
      '</div>';
    var i = 0;
    var timer = setInterval(function () {
      i++;
      var el = document.getElementById('atxt');
      if (el && texts[i]) el.textContent = texts[i];
      if (i >= texts.length) clearInterval(timer);
    }, 520);
    setTimeout(function () { clearInterval(timer); showResult(); }, 1500);
  }

  /* ---------- 结果 ---------- */
  function resultHTML(quiz, mainKey, sec, isShared) {
    var r = quiz.results[mainKey];
    var primaryLabel = quiz.secondary && quiz.secondary.label
      ? quiz.secondary.label : '';
    var html = '';

    if (isShared) {
      html += '<div class="sharedbar">这是好友分享的结果 · 往下滑可以自己测一遍</div>';
    }

    html +=
      '<div class="rcard">' +
        '<div class="rtag">' +
          '<span class="remoji">' + esc(r.emoji) + '</span>' +
          '<span class="rname">' + esc(r.name) + '</span>' +
        '</div>' +
        '<div class="rquote">「' + esc(r.quote) + '」</div>';

    if (sec) {
      html +=
        '<div class="rsec">' + esc(primaryLabel) + '<b>' + esc(sec.value) + '</b></div>' +
        '<div class="rsec-text">' + esc(sec.text) + '</div>';
    }

    html += '<div class="divider"></div>';

    if (r.other) {
      html += '<div class="rline"><span class="rlabel">别人眼中的你</span><p>' + esc(r.other) + '</p></div>';
    }
    if (r.hidden) {
      html += '<div class="rline"><span class="rlabel">你自己不知道的你</span><p>' + esc(r.hidden) + '</p></div>';
    }
    if (r.action) {
      html += '<div class="rline action"><span class="rlabel">一句话</span><p>' + esc(r.action) + '</p></div>';
    }
    html += '</div>';

    html +=
      '<div class="actions">' +
        '<button class="btn primary" id="btnShare">' + (isShared ? '我也要测' : '复制分享链接') + '</button>' +
        (isShared ? '' : '<button class="btn ghost" id="btnRetry">再测一次</button>') +
      '</div>';

    if (quiz.notice) html += '<p class="notice">' + esc(quiz.notice) + '</p>';
    return html;
  }

  function bindResult(quiz, mainKey, sec, isShared) {
    var share = document.getElementById('btnShare');
    if (share) {
      share.addEventListener('click', function () {
        if (isShared) { restart(quiz); return; }
        var url = location.origin + location.pathname +
          '?q=' + encodeURIComponent(quiz.id) +
          '&m=' + encodeURIComponent(mainKey) +
          (sec ? '&s=' + sec.index : '');
        var text = '「' + quiz.title + '」我的结果是：' + quiz.results[mainKey].name + '\n' + url;
        if (navigator.share) {
          navigator.share({ title: quiz.title, text: quiz.results[mainKey].name, url: url })
            .catch(function () { copyText(text, '已复制，去分享给朋友吧'); });
        } else {
          copyText(text, '已复制，去分享给朋友吧');
        }
      });
    }
    var retry = document.getElementById('btnRetry');
    if (retry) {
      retry.addEventListener('click', function () { restart(quiz); });
    }
  }

  function showResult() {
    var quiz = state.quiz;
    var mainKey = calcMain(quiz);
    var sec = calcSecondary(quiz);
    app.innerHTML = '<div class="screen result">' + resultHTML(quiz, mainKey, sec, false) + '</div>';
    bindResult(quiz, mainKey, sec, false);
    window.scrollTo(0, 0);
  }

  function showSharedResult(quiz, mainKey, secIndex) {
    var sec = null;
    if (quiz.secondary && secIndex != null && quiz.secondary.levels[secIndex]) {
      var lv = quiz.secondary.levels[secIndex];
      sec = { index: secIndex, text: lv.text, value: lv.value };
    }
    app.innerHTML = '<div class="screen result">' + resultHTML(quiz, mainKey, sec, true) + '</div>';
    bindResult(quiz, mainKey, sec, true);
  }

  function restart(quiz) {
    state.picks = [];
    state.idx = 0;
    history.replaceState(null, '', location.pathname + (quiz.id ? '?q=' + quiz.id : ''));
    renderStart();
  }

  /* ---------- 启动 ---------- */
  function boot() {
    var quiz = resolveQuiz();
    if (!quiz) {
      app.innerHTML = '<div class="screen"><div class="card">没有找到题库。</div></div>';
      return;
    }
    state.quiz = quiz;
    state.picks = new Array(quiz.questions.length).fill(null);

    var m = params.get('m');
    var s = params.get('s');
    if (m && quiz.results[m]) {
      document.title = quiz.title;
      showSharedResult(quiz, m, s == null ? null : Number(s));
    } else {
      renderStart();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
